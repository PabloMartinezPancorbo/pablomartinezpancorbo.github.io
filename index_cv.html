                    <div key={i} className="flex gap-4 p-4 rounded-lg border dm-border"
                         style={{ borderColor: dark ? '#374151' : '#f3f4f6' }}>
                      <div className="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center"
                           style={{ background: dark ? '#1f2937' : '#f3f4f6' }}>
                        <EducationIcon type={e.icon} />
                      </div>
                      <div>
                        <h3 className="font-bold text-gray-800 dm-text leading-tight">{e.deg}</h3>
                        <p className="text-blue-600 font-semibold text-sm mt-0.5">{e.school}</p>
                        <p className="text-xs text-gray-400 dm-muted mt-0.5">{e.period} · {e.loc}</p>
                        <p className="text-sm text-gray-500 dm-text2 mt-1">{e.note}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CERTIFICATIONS */}
            {activeTab === 'certifications' && (
              <div className="bg-white dm-card p-6 rounded-lg shadow-md fade-in">
                <h2 className="text-2xl font-bold mb-6 dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                  Certifications
                </h2>
                <div className="space-y-3">
                  {certifications.map((c, i) => (
                    <div key={i} className="flex items-center justify-between p-4 rounded-lg border dm-border"
                         style={{ borderColor: dark ? '#374151' : '#f3f4f6' }}>
                      <div className="flex items-center gap-3">
                        <span className="text-gray-500 flex-shrink-0">
                          {c.n.startsWith('AWS') ? <ICertCloudMono /> : <ICertAwardMono />}
                        </span>
                        <span className="font-medium text-sm text-gray-700 dm-text2">{c.n}</span>
                      </div>
                      <span className="text-xs text-gray-400 dm-muted font-mono flex-shrink-0 ml-4">{c.d}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-5 p-4 rounded-lg"
                     style={{ background: dark ? '#1f2937' : '#f9fafb' }}>
                  <p className="text-sm font-semibold" style={{ color: dark ? '#e5e7eb' : '#374151' }}>
                    8+ Certifications — including 7 AWS certifications
                  </p>
                  <p className="text-xs mt-1" style={{ color: dark ? '#9ca3af' : '#6b7280' }}>
                    AWS Solutions Architecture · Machine Learning Specialty · Data Engineering · Developer Associate · CloudOps · AI Practitioner
                  </p>
                </div>
              </div>
            )}

            {/* PROJECTS */}
            {activeTab === 'projects' && (
              <div className="space-y-5 fade-in">
                <div className="bg-white dm-card p-6 rounded-lg shadow-md">
                  <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                    <h2 className="text-2xl font-bold dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                      Selected Projects
                    </h2>
                    <p className="text-sm text-gray-400 dm-muted">Strategic delivery, public educational tools, and knowledge sharing builds</p>
                  </div>
                  <Projects projects={projects} dark={dark} />
                </div>
              </div>
            )}

            {/* PUBLICATIONS */}
            {activeTab === 'publications' && (
              <div className="bg-white dm-card p-6 rounded-lg shadow-md fade-in">
                <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                  <h2 className="text-2xl font-bold dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                    Selected Publications
                  </h2>
                  <a href={SCHOLAR} target="_blank" rel="noopener noreferrer"
                     className="flex items-center gap-2 text-sm text-blue-600 hover:underline font-medium">
                    <IScholar /> All on Google Scholar ↗
                  </a>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                  {[
                    { n: '8',   l: 'Publications' },
                    { n: '244', l: 'Citations' },
                    { n: 'Google Scholar', l: 'Profile' },
                  ].map((s, i) => (
                    <div key={i} className="dm-statbg bg-blue-50 rounded-lg p-4 text-center">
                      <div className="text-2xl font-bold text-blue-600">{s.n}</div>
                      <div className="text-xs text-gray-500 dm-muted mt-1">{s.l}</div>
                    </div>
                  ))}
                </div>
                <Publications publications={publications} copied={copied} onCopy={copyCite} />
              </div>
            )}

          </main>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
