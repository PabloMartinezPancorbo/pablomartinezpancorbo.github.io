                  <button

                    className="hero-action flex items-center justify-center w-9 h-9 rounded-full border border-gray-300 text-gray-500 hover:border-blue-500 hover:text-blue-600 hover:bg-blue-50 transition-all"
                  style={dark ? { borderColor:'#6b7280', color:'#d1d5db', background:'#1f2937' } : {}}>
                    <IPrint />
                  </button>
                  <span className="ic-tip">Download PDF</span>
                </div>
              </div>
            </div>
          </header>

          {/* ── NAV (scrollable on mobile) ── */}
          <div className="nav-shell no-print">
            <div className={`swipe-hint-wrap ${swipeHintVisible ? '' : 'is-hidden'}`} aria-hidden="true">
              <div className="swipe-hint">
                <div className="swipe-hint-track"></div>
                <div
                  key={swipeHintRun}
                  className={`swipe-hint-hand ${swipeHintVisible ? 'is-playing' : ''}`}
                  onAnimationEnd={() => setSwipeHintVisible(false)}
                >
                  <ISwipeHand />
                </div>
                <div className="swipe-hint-fade"></div>
              </div>
            </div>
            <div
              ref={navScrollRef}
              onScroll={handleNavScroll}
              className="nav-scroll"
            >
              <div className="nav-inner justify-center mx-auto" style={{ width: 'max-content', margin: '0 auto' }}>
                {TABS.map(t => (
                  <button
                    key={t.id}
                    className={`mx-1 px-4 py-2 rounded text-sm font-medium transition-colors whitespace-nowrap ${
                      activeTab === t.id
                        ? 'bg-blue-500 text-white'
                        : 'bg-gray-200 dm-nav-off text-gray-700 hover:bg-gray-300'
                    }`}
                    onClick={() => setActiveTab(t.id)}>
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ── MAIN CONTENT ── */}
          <main>

            {/* ABOUT */}
            {activeTab === 'about' && (

                  Data Science, Machine Learning, and R&amp;D. Proven track record of driving innovation, accelerating large
                  cloud migrations, leading responsible enterprise-scale digital transformations, directing pre-sales and
                  delivering high-impact, high-ROI business outcomes across{' '}
                  <strong className="text-blue-600">AWS, Azure and GCP ecosystems</strong>.
                </p>
                <p className="text-gray-600 dm-text2 leading-relaxed mb-6">
                  Skilled in leading cross-functional teams composed of technical, product and business personas in Agile,
                  DevOps, and CI/CD environments. Worked and travelled for work across <strong className="text-blue-600">11 countries</strong>{' '}
                  in <strong className="text-blue-600">North America, Europe, and Asia</strong>. Actively pursuing strategic, high-impact roles
                  with premium compensation and long-term growth potential.
                </p>
                <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                  {[
                    { n: '10+',   l: 'Years in tech & R&D'    },
                    { n: '$170M+',l: 'Cloud budget managed'   },
                    { n: '11',    l: 'Countries worked in'    },
                    { n: '8',     l: 'Publications'           },
                    { n: '244',   l: 'Google Scholar citations' },
                    { n: '8+',    l: 'Certifications'         },
                  ].map((s, i) => (
                    <div key={i} className="dm-statbg bg-blue-50 rounded-lg p-4 text-center">
                      <div className="text-2xl font-bold text-blue-600">{s.n}</div>
                      <div className="text-xs text-gray-500 dm-muted mt-1">{s.l}</div>
                    </div>
                  ))}
                </div>
                <div className="mb-6">
                  <p className="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-3">Selected Impact Areas</p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {[
                      {
                        t: 'Cloud Transformation',
                        d: 'Led and supported enterprise cloud transformation programmes spanning strategy, operating model evolution, architecture alignment, and value-focused execution.'
                      },
                      {
                        t: 'FinOps & Cost Optimisation',
                        d: 'Drove FinOps best practices, cloud cost optimisation, and governance mechanisms across large customer environments to improve ROI and accountability.'
                      },
                      {
                        t: 'Cloud Migration & Modernisation',
                        d: 'Accelerated cloud migration and modernisation initiatives through stakeholder alignment, delivery coordination, cloud-native patterns, and adoption planning.'
                      },
                      {
                        t: 'AI Prototyping',
                        d: 'Built and guided proof of concepts, proof of values, interactive demos, and customer-facing prototypes to validate technical and commercial outcomes.'
                      },
                      {
                        t: 'AI Production Strategy',
                        d: 'Helped define how AI solutions move from experimentation into production, with attention to governance, reliability, scale, observability, and business value.'
                      },
                      {
                        t: 'Full MLOps Orchestration',
                        d: 'Worked across model development, pipelines, deployment, monitoring, experimentation, and continuous improvement using cloud-native and DevOps-aligned practices.'
                      },
                      {
                        t: 'Agentic AI',
                        d: 'Led and supported enterprise discussions, prototypes, and solution patterns around agentic AI, orchestration, tool use, retrieval, and governed GenAI delivery.'
                      },
                      {
                        t: 'Laboratory Automation & Advanced R&D',
                        d: 'Led scientific automation and research-driven innovation programmes, including pharma experimentation workflows, wearable sensing, and cancer diagnostics research.'
                      },
                    ].map((x, i) => (
                      <div key={i} className="p-4 rounded-lg border dm-border"
                           style={{ borderColor: dark ? '#374151' : '#e5e7eb' }}>
                        <h3 className="font-semibold text-sm mb-1 dm-text">{x.t}</h3>
                        <p className="text-sm text-gray-600 dm-text2 leading-relaxed">{x.d}</p>
                      </div>
                    ))}
                  </div>
                </div>
                <p className="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">Keywords</p>
                <div className="flex flex-wrap">
                  {techTags.map((t, i) => <span key={i} className="tag-pill">{t}</span>)}
                </div>
              </div>
            )}

            {/* SKILLS */}
            {activeTab === 'skills' && (
              <div className="space-y-6 fade-in">
                <div className="bg-white dm-card p-6 rounded-lg shadow-md">
                  <h2 className="text-2xl font-bold mb-1 dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                    Skills
                  </h2>
                  <p className="text-xs text-gray-400 dm-muted mb-4">Spider chart — relative proficiency out of 10</p>
                  <SkillChart skills={skills} dark={dark} />
                </div>
                <div className="bg-white dm-card p-6 rounded-lg shadow-md">
                  <h2 className="text-2xl font-bold mb-4 dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                    Technical Proficiency
                  </h2>
                  <SkillBars dark={dark} />

                  Experience

                <ExperienceTimeline experiences={experiences} dark={dark} />

            {/* EDUCATION */}
            {activeTab === 'education' && (

                  Education

                <div className="space-y-4">
                  {education.map((e, i) => (
                    <div key={i} className="flex gap-4 p-4 rounded-lg border dm-border"
                         style={{ borderColor: dark ? '#374151' : '#f3f4f6' }}>
                      <div className="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center"
                           style={{ background: dark ? '#1f2937' : '#f3f4f6' }}>
                        <span style={{ color: dark ? '#d1d5db' : '#6b7280' }}><EducationIcon type={e.icon} /></span>
                      </div>
                      <div>
                        <h3 className="font-bold text-gray-800 dm-text leading-tight">{e.deg}</h3>
                        <p className="text-blue-600 font-semibold text-sm mt-0.5">{renderSchoolLabel(e.school)}</p>
                        <p className="text-xs text-gray-400 dm-muted mt-0.5">{e.period} · {e.loc}</p>
                        <p className="text-sm text-gray-500 dm-text2 mt-1">{e.note}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CERTIFICATIONS */}
            {activeTab === 'certifications' && (
              <div className="bg-white dm-card p-6 rounded-lg shadow-md fade-in">
                <h2 className="text-2xl font-bold mb-6 dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                  Certifications
                </h2>
                <div className="space-y-3">
                  {certifications.map((c, i) => (
                    <div key={i} className="flex items-center justify-between p-4 rounded-lg border dm-border"
                         style={{ borderColor: dark ? '#374151' : '#f3f4f6' }}>
                      <div className="flex items-center gap-3">
                        <span className="flex-shrink-0" style={{ color: dark ? '#d1d5db' : '#6b7280' }}>
                          {c.n.startsWith('AWS') ? <ICertCloudMono /> : <ICertAwardMono />}
                        </span>
                        <span className="font-medium text-sm text-gray-700 dm-text2">{c.n}</span>
                      </div>
                      <span className="text-xs text-gray-400 dm-muted font-mono flex-shrink-0 ml-4">{c.d}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-5 p-4 rounded-lg"
                     style={{ background: dark ? '#1f2937' : '#f9fafb' }}>
                  <p className="text-sm font-semibold" style={{ color: dark ? '#e5e7eb' : '#374151' }}>
                    8+ Certifications — including 7 AWS certifications
                  </p>
                  <p className="text-xs mt-1" style={{ color: dark ? '#9ca3af' : '#6b7280' }}>
                    AWS Solutions Architecture · Machine Learning Specialty · Data Engineering · Developer Associate · CloudOps · AI Practitioner
                  </p>
                </div>
              </div>
            )}

            {/* PROJECTS */}
            {activeTab === 'projects' && (
              <div className="space-y-5 fade-in">
                <div className="bg-white dm-card p-6 rounded-lg shadow-md">
                  <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                    <h2 className="text-2xl font-bold dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                      Selected Projects
                    </h2>
                    <p className="text-sm text-gray-400 dm-muted">Strategic delivery, public educational tools, and knowledge sharing builds</p>
                  </div>
                  <Projects projects={projects} dark={dark} />
                </div>
              </div>
            )}

            {/* PUBLICATIONS */}
            {activeTab === 'publications' && (
              <div className="bg-white dm-card p-6 rounded-lg shadow-md fade-in">
                <div className="flex items-center justify-between flex-wrap gap-3 mb-4">
                  <h2 className="text-2xl font-bold dm-text" style={{ color: dark ? '#f9fafb' : '#1f2937' }}>
                    Selected Publications
                  </h2>
                  <a href={SCHOLAR} target="_blank" rel="noopener noreferrer"
                     className="flex items-center gap-2 text-sm text-blue-600 hover:underline font-medium">
                    <IScholar /> All on Google Scholar ↗
                  </a>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-3">
                  {[
                    { n: '8',   l: 'Publications' },
                    { n: '244', l: 'Citations' },
                    { n: '7',   l: 'Research countries' },
                  ].map((s, i) => (
                    <div key={i} className="dm-statbg bg-blue-50 rounded-lg p-4 text-center">
                      <div className="text-2xl font-bold text-blue-600">{s.n}</div>
                      <div className="text-xs text-gray-500 dm-muted mt-1">{s.l}</div>
                    </div>
                  ))}
                </div>
                <p className="text-sm text-gray-500 dm-muted mb-6">
                  Research carried out across China, the UK, Spain, France, Denmark, the USA, and Japan.
                </p>
                <Publications publications={publications} copied={copied} onCopy={copyCite} />
              </div>
            )}

          </main>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
